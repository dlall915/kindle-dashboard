# dropbear-standalone: launches KOReader's bundled dropbear SSH server at
# boot, independent of KOReader ever being launched. Added so remote
# access does not depend on the KOReader SSH.koplugin's own autostart.
# Reuses the exact binary/command/pidfile SSH.koplugin itself uses
# (see /mnt/us/koreader/plugins/SSH.koplugin/main.lua) so the two never
# conflict - SSH.koplugin checks for this same pidfile before starting
# its own copy, and this job does the same check before starting.
#
# Deploy target: /etc/upstart/dropbear-standalone.conf (root filesystem
# is mounted read-only; use `mntroot rw` / `mntroot ro` to install it -
# see boot/README.md).
#
# Two things learned the hard way testing this on real hardware:
#
# 1. "start on started system" fires before /mnt/us (the FUSE-mounted
#    userstore partition) is ready, so `cd /mnt/us/koreader` fails and
#    dropbear never launches. `mounted_userstore` (emitted by
#    /etc/upstart/filesystems_userstore.conf) is the right event to wait
#    for instead.
# 2. dropbear daemonizes itself (forks and its own parent process exits
#    once the real daemon is detached and listening). Upstart's
#    `respawn` stanza reads that parent exit as "the job died" and keeps
#    relaunching it - each relaunch fails to rebind the now-taken port,
#    and duplicate `iptables` rules pile up on every attempt before
#    upstart eventually gives up. No `respawn` stanza here on purpose:
#    the daemon manages its own lifetime once launched. The pidfile
#    check below also makes re-running this job safe if
#    `mounted_userstore` ever fires more than once in one boot.

start on mounted_userstore
stop on stopping system

script
  PIDFILE=/tmp/dropbear_koreader.pid
  if [ -f "$PIDFILE" ] && [ -d "/proc/$(cat "$PIDFILE" 2>/dev/null)" ]; then
    exit 0
  fi

  iptables -A INPUT -p tcp --dport 2222 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT
  iptables -A OUTPUT -p tcp --sport 2222 -m conntrack --ctstate ESTABLISHED -j ACCEPT

  cd /mnt/us/koreader
  ./dropbear -E -R -p2222 -P "$PIDFILE" -n
end script
